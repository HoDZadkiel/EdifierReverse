[project]
name = "edifier-reverse"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = [
    "bleak>=3.0.2",
]

[project.optional-dependencies]
tray = [
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "pycaw>=20240210",
]

[project.scripts]
edifier-reverse = "edifier_reverse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edifier_reverse"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
